services:
  - type: web
    name: bingo-zen-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: POSTGRES_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: PWA_DOMAIN
        value: bingo-zen.onrender.com
      - key: FEATURE_LEADERBOARD
        value: "1"
      - key: FEATURE_FRIENDS
        value: "1"
      - key: FEATURE_NOTIFICATIONS
        value: "1"
      - key: FEATURE_RATING
        value: "1"
      - key: FEATURE_ANALYTICS
        value: "1"
      - key: FEATURE_ADS
        value: "0"
      - key: PORT
        value: "10000"